server.port=${PORT:8080}
spring.application.name=QR Ordering System
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/qr_ordering}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set this to your public URL if auto-detection does not work.
# On Railway, leave this blank — the app detects its URL automatically.
# Example: app.public-url=https://your-app.up.railway.app
app.public-url=
